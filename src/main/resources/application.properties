spring.application.name=outflowPayment
server.port=9091

spring.datasource.url= ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/bluepay}
spring.datasource.username= ${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password= ${JDBC_DATABASE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
flowable.eventregistry.enabled=true
flowable.eventregistry.resource-location=classpath*:/eventregistry/

spring.rabbitmq.addresses=amqps://rlnofpyt:EiEimHuGpB-H_id2aCFhXUFMvSyjTVGU@leopard.lmq.cloudamqp.com/rlnofpyt

message.flowable.message.exchange= ${FLOWABLE_MESSAGE_QUEUE:flowable.message.exchange}
message.outflowPayment.queue=${OUTFLOW_PAYMENT_QUEUE:outflowPayment.queue}
message.outflowPayment-routing-key= ${OUTFLOW_PAYMENT_ROUTING_KEY:outflowPayment.routingKey}
message.outflowPayment.task.verifier.queue= ${OUTFLOW_PAYMENT_TASK_VERIFIER_QUEUE:outflowPayment.task.verifier.queue}
message.outflowPayment.task.authorizer.queue= ${OUTFLOW_PAYMENT_TASK_AUTHORIZER_QUEUE:outflowPayment.task.authorizer.queue}
message.outflowPayment.task.verifier= ${OUTFLOW_PAYMENT_TASK_VERIFIER:outflowPayment.task.verifier}
message.outflowPayment.task.authorizer= ${OUTFLOW_PAYMENT_TASK_AUTHORIZER:outflowPayment.task.authorizer}
message.bluepay.settlement-result-routing-key=${BLUEPAY_SETTLEMENT_RESULT_ROUTING_KEY:bluepay.settlement.result}

payouts.default-provider=${PAYOUTS_DEFAULT_PROVIDER:dev}
payouts.http.transfer-url=${PAYOUTS_HTTP_TRANSFER_URL:}
payouts.http.api-key=${PAYOUTS_HTTP_API_KEY:}

# OpenAPI documentation
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

